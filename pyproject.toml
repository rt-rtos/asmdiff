[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asmdiff"
dynamic = ["version"]
description = "Per-function assembly inspection and comparison, across a compiler matrix or from a shipped ELF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    { name = "Rasmus Tikkanen" },
]
keywords = [
    "assembly", "compiler", "gcc", "clang", "disassembly", "codegen",
    "diff", "static-analysis", "embedded", "firmware", "dsp",
    "xtensa", "arm", "riscv", "cli", "devtools", "loop-analysis", "cfg", "objdump"
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/rt-rtos/asmdiff"
Repository = "https://github.com/rt-rtos/asmdiff"

[project.scripts]
asmdiff = "asmdiff:main"

[tool.hatch.version]
path = "asmdiff.py"

# Explicit allowlist: hatchling's default sdist selection includes every
# file that is not VCS-ignored, which sweeps untracked working files
# (and even old dist/ artifacts) into the published tarball.
[tool.hatch.build.targets.sdist]
only-include = [
    "asmdiff.py",
    "test_asmdiff.py",
    "asmdiff_example.c",
    "asmdiff.example.toml",
    "README.md",
]

[tool.hatch.build.targets.wheel]
include = ["asmdiff.py"]
